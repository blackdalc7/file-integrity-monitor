[project]
name = "file-integrity-monitor"
version = "1.0.0"
description = "Tripwire-style file integrity monitor: baseline a directory tree and detect added, removed or modified files"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
fim = "fim.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["fim"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
